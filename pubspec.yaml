name: kayhan_app
description: "Kayhan Audio — car audio & accessories store."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Networking & state
  dio: ^5.9.0
  provider: ^6.1.5+1
  go_router: ^16.2.0
  shared_preferences: ^2.5.3

  # UI
  cached_network_image: ^3.4.1
  intl: ^0.20.2

  # Push notifications
  onesignal_flutter: ^5.3.4
  firebase_core: ^3.4.0
  firebase_messaging: ^15.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
